# Deploys the Next.js app in web/ -- the FastAPI backend (main.py/db.py
# at the repo root) is NOT part of this deploy; it's a separate
# process this config doesn't touch.
#
# (Trivial comment-only change to force a fresh ltorres-1 branch
# deploy after adding THESPORTSDB_API_KEY to Netlify's env vars --
# "Trigger deploy" in the Netlify UI defaulted to rebuilding
# production instead of this branch, so a real push is the reliable
# way to get the branch-deploy path to rebuild with the new variable.)
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Netlify's official Next.js integration -- handles SSR/RSC/Server
# Actions via Netlify Functions automatically, no manual adapter
# config needed for a standard Next.js App Router project like this
# one.
[[plugins]]
  package = "@netlify/plugin-nextjs"
