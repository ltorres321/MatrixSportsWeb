<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- ears -->
    <ellipse cx="72" cy="55" rx="16" ry="42" fill="#f4fff9" transform="rotate(-12 72 55)" />
    <ellipse cx="128" cy="55" rx="16" ry="42" fill="#f4fff9" transform="rotate(12 128 55)" />
    <!-- inner ears -->
    <ellipse cx="72" cy="58" rx="7" ry="26" fill="#0d7a2e" opacity="0.55" transform="rotate(-12 72 58)" />
    <ellipse cx="128" cy="58" rx="7" ry="26" fill="#0d7a2e" opacity="0.55" transform="rotate(12 128 58)" />

    <!-- head -->
    <circle cx="100" cy="128" r="44" fill="#f4fff9" />
    <!-- cheeks -->
    <circle cx="74" cy="140" r="14" fill="#f4fff9" />
    <circle cx="126" cy="140" r="14" fill="#f4fff9" />

    <!-- eyes -->
    <circle cx="86" cy="122" r="5" fill="#030603" />
    <circle cx="114" cy="122" r="5" fill="#030603" />
    <!-- nose -->
    <path d="M 100 132 L 94 140 L 106 140 Z" fill="#26ff64" />
    <!-- whisker dots -->
    <circle cx="70" cy="142" r="2" fill="#030603" opacity="0.7" />
    <circle cx="130" cy="142" r="2" fill="#030603" opacity="0.7" />
  </g>
</svg>
